# OpenTelemetry Health Check Workflow
# Verifies OTLP endpoint health, metric emission, trace export, and alert thresholds.

name: OpenTelemetry Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily health check at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
  OTEL_SERVICE_NAME: "forgecode-ci"

jobs:
  otel-health:
    name: OTLP Endpoint Health Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install opentelemetry-api opentelemetry-sdk \
                      opentelemetry-exporter-otlp-proto-grpc \
                      opentelemetry-exporter-otlp-proto-http \
                      opentelemetry-test-utils \
                      pytest httpx

      - name: Verify OTLP endpoint reachability
        run: |
          python -c "
          import urllib.request, urllib.error, json, sys

          endpoint = '${{ env.OTEL_EXPORTER_OTLP_ENDPOINT }}'
          http_endpoint = endpoint.replace('4317', '4318')

          print(f'Checking OTLP endpoints...')
          print(f'  gRPC: {endpoint}')
          print(f'  HTTP: {http_endpoint}')

          try:
              req = urllib.request.Request(f'{http_endpoint}/v1/metrics', method='GET')
              resp = urllib.request.urlopen(req, timeout=5)
              print(f'  HTTP health: {resp.status} OK')
          except urllib.error.HTTPError as e:
              if e.code == 405:
                  print(f'  HTTP health: endpoint alive (405 Method Not Allowed as expected for GET)')
              else:
                  print(f'  HTTP health: {e.code} (may be expected without collector)')
          except Exception as e:
              print(f'  HTTP health: unreachable ({e})')
              print(f'  This is expected if no collector is running in CI.')
          "

      - name: Validate telemetry module initialization
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from telemetry import ForgeTelemetry, ExporterProtocol

          # Verify module loads
          print('ForgeTelemetry class loaded successfully')

          # Verify ExporterProtocol enum
          assert ExporterProtocol.GRPC.value == 'grpc'
          assert ExporterProtocol.HTTP.value == 'http/protobuf'
          print('ExporterProtocol enum validated')

          # Verify singleton factory functions exist
          from telemetry import init_telemetry, get_telemetry
          print('Singleton factory functions available')
          "

      - name: Test metric emission
        run: |
          python -c "
          from opentelemetry import metrics
          from opentelemetry.sdk.metrics import MeterProvider
          from opentelemetry.sdk.metrics.export import (
              InMemoryMetricReader,
              AggregationTemporality,
          )
          from opentelemetry.sdk.resources import Resource

          resource = Resource.create({'service.name': 'ci-health-check'})
          reader = InMemoryMetricReader()
          provider = MeterProvider(resource=resource, metric_readers=[reader])
          metrics.set_meter_provider(provider)

          meter = metrics.get_meter('health-check')

          # Create and emit counters
          counter = meter.create_counter('test.requests.total')
          counter.add(42, {'env': 'ci'})
          histogram = meter.create_histogram('test.latency.ms')
          histogram.record(150.0, {'env': 'ci'})

          # Read metrics
          data = reader.get_metrics_data()
          metrics_found = set()
          for rm in data.resource_metrics:
              for sm in rm.scope_metrics:
                  for m in sm.metrics:
                      metrics_found.add(m.name)

          assert 'test.requests.total' in metrics_found, f'Missing counter, found: {metrics_found}'
          assert 'test.latency.ms' in metrics_found, f'Missing histogram, found: {metrics_found}'
          print(f'Emitted and collected {len(metrics_found)} metric instruments')

          provider.shutdown()
          print('Metric emission validated successfully')
          "

      - name: Test trace export
        run: |
          python -c "
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor, InMemorySpanExporter
          from opentelemetry.sdk.resources import Resource
          from opentelemetry.trace import StatusCode

          resource = Resource.create({'service.name': 'ci-health-check'})
          exporter = InMemorySpanExporter()
          provider = TracerProvider(resource=resource)
          provider.add_span_processor(SimpleSpanProcessor(exporter))
          trace.set_tracer_provider(provider)

          tracer = trace.get_tracer('health-check')

          # Emit a span
          with tracer.start_as_current_span('ci-test-span') as span:
              span.set_attribute('test.key', 'ci-value')
              span.add_event('test-event', {'detail': 'health check'})
              span.set_status(StatusCode.OK)

          spans = exporter.get_finished_spans()
          assert len(spans) == 1, f'Expected 1 span, got {len(spans)}'
          assert spans[0].name == 'ci-test-span'
          assert spans[0].attributes['test.key'] == 'ci-value'
          assert spans[0].status.status_code == StatusCode.OK
          print(f'Trace export validated: 1 span with {len(spans[0].events)} event(s)')

          provider.shutdown()
          "

  metric-alerts:
    name: Alert Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install opentelemetry-api opentelemetry-sdk \
                      opentelemetry-test-utils

      - name: Validate alert thresholds
        run: |
          python -c "
          import json, sys

          # Load dashboard config if available
          config_path = 'agileplus/dashboard-config.json'
          try:
              with open(config_path) as f:
                  config = json.load(f)
          except FileNotFoundError:
              print('Dashboard config not found, using defaults')
              config = {
                  'alert_thresholds': {
                      'error_rate_pct': 5.0,
                      'p99_latency_ms': 1000,
                      'cpu_saturation_pct': 80,
                      'memory_saturation_pct': 85
                  }
              }

          thresholds = config.get('alert_thresholds', {})
          print('Alert Threshold Configuration:')
          for key, value in thresholds.items():
              print(f'  {key}: {value}')

          # Validate threshold ranges
          assert thresholds.get('error_rate_pct', 0) <= 100, 'Error rate must be <= 100%'
          assert thresholds.get('p99_latency_ms', 0) > 0, 'P99 latency must be positive'
          assert thresholds.get('cpu_saturation_pct', 0) <= 100, 'CPU must be <= 100%'
          assert thresholds.get('memory_saturation_pct', 0) <= 100, 'Memory must be <= 100%'

          print('All alert thresholds validated')
          "
