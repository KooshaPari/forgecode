# Chaos Gate Workflow
# Runs on every PR and blocks merge if chaos tests fail.
# Use 'needs: [chaos-gate]' in merge queue configuration.

name: Chaos Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  chaos-gate:
    name: Chaos Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio opentelemetry-api opentelemetry-sdk

      - name: Run critical chaos tests (gate)
        run: |
          pytest tests/chaos/test_resilience.py::TestCircuitBreaker \
                 tests/chaos/test_resilience.py::TestRetryBackoff \
                 tests/chaos/test_resilience.py::TestTimeoutHandling \
                 -v --tb=short --junitxml=reports/chaos-gate.xml \
                 -o log_cli=true 2>&1 | tee reports/chaos-gate.log

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-gate-results
          path: |
            reports/chaos-gate.xml
            reports/chaos-gate.log
          retention-days: 30

      - name: Fail gate if chaos tests failed
        if: failure()
        run: |
          echo "::error::Chaos gate tests failed - merge blocked"
          exit 1
