name: Sign Release Binaries
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to sign
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PWD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_NOTARIZATION_APPLE_ID:
        required: false
      MACOS_NOTARIZATION_PWD:
        required: false
      MACOS_NOTARIZATION_TEAM_ID:
        required: false
      SIGNPATH_API_TOKEN:
        required: false
      SIGNPATH_ORGANIZATION_ID:
        required: false
permissions:
  contents: read
jobs:
  sign:
    name: sign-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pattern: "*apple-darwin*"
            platform: macos
          - os: windows-latest
            pattern: "*windows-msvc*"
            platform: windows
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - name: Require configured signing identity
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            required="SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG"
          else
            required="MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_SIGNING_IDENTITY MACOS_NOTARIZATION_APPLE_ID MACOS_NOTARIZATION_PWD MACOS_NOTARIZATION_TEAM_ID"
          fi
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing configuration: $name"
              exit 1
            fi
          done
      - name: Download release binaries
        run: |
          set -euo pipefail
          mkdir -p binaries
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir binaries \
            --pattern "${{ matrix.pattern }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── macOS Signing + Notarization ──
      - if: matrix.platform == 'macos'
        name: Import macOS certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ env.MACOS_CERTIFICATE }}
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          CERTIFICATE_PATH="${{ runner.temp }}/certificate.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          KEYCHAIN_PATH="${{ runner.temp }}/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - if: matrix.platform == 'macos'
        name: Codesign macOS binaries
        run: |
          for bin in binaries/forge-*-apple-darwin binaries/helioslite-*-apple-darwin binaries/forge_dbd-*-apple-darwin; do
            [ -f "$bin" ] || continue
            echo "Signing $bin..."
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" \
              --keychain "${{ runner.temp }}/app-signing.keychain-db" \
              "$bin"
            codesign --verify --verbose "$bin"
          done

      - if: matrix.platform == 'macos'
        name: Notarize macOS binaries
        run: |
          mkdir -p notarize
          for bin in binaries/forge-*-apple-darwin binaries/helioslite-*-apple-darwin binaries/forge_dbd-*-apple-darwin; do
            [ -f "$bin" ] || continue
            cp "$bin" notarize/
          done
          cd notarize
          ZIPFILE="notarize-bundle.zip"
          zip -r "$ZIPFILE" .
          xcrun notarytool submit "$ZIPFILE" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PWD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --wait --output-format json > result.json
          jq -e '.status == "Accepted"' result.json >/dev/null
          cd ..
          # Raw Mach-O command-line binaries cannot be stapled; the submitted
          # ZIP receives notarization. Keep the signed raw assets unchanged.

      - if: matrix.platform == 'windows'
        name: Upload unsigned Windows artifacts
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-windows
          path: binaries/*.exe
          if-no-files-found: error

      - if: matrix.platform == 'windows'
        name: Sign Windows binaries via SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - if: matrix.platform == 'windows'
        name: Verify and replace signed Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem binaries/*.exe) {
            $signed = Join-Path signed $file.Name
            if ((Get-AuthenticodeSignature $signed).Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($file.Name)"
            }
            Copy-Item $signed $file.FullName -Force
          }

      - name: Regenerate checksums for signed assets
        run: |
          set -euo pipefail
          for bin in binaries/*; do
            case "$bin" in *.sha256) continue ;; esac
            [ -f "$bin" ] || continue
            (cd binaries
             name=$(basename "$bin")
             if command -v sha256sum >/dev/null 2>&1; then
               sha256sum "$name" > "$name.sha256"
             else
               shasum -a 256 "$name" > "$name.sha256"
             fi)
          done

      # ── Re-upload signed binaries ──
      - name: Re-upload signed binaries
        run: |
          set -euo pipefail
          for f in binaries/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            echo "Uploading $fname..."
            gh release upload "${{ inputs.tag }}" "$f" \
              --repo "${{ github.repository }}" \
              --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
