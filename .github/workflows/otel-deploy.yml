# OpenTelemetry Collector — Production Deployment
# ================================================
# Deploys the OTel collector stack to a cloud environment.
# Supports two modes:
#   1. GitHub-hosted runner (self-contained Docker Compose)
#   2. Remote host via SSH (AWS EC2, GCP CE, or any Linux host)
#
# Triggered via workflow_dispatch with environment selection.

name: Deploy OTel Collector (forgecode)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_mode:
        description: 'Deployment mode'
        required: true
        default: 'runner'
        type: choice
        options:
          - runner
          - remote-ssh
      production_flag:
        description: 'Use production compose file'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  HEALTH_TIMEOUT: 90

jobs:
  # ── Validate ──────────────────────────────────────────────────────
  validate:
    name: Validate OTel Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate collector config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:latest \
            --config=/etc/otelcol/config.yaml --dry-run

      - name: Validate docker-compose syntax
        run: |
          cd otel
          docker compose config --quiet

  # ── Deploy on GitHub-hosted runner ────────────────────────────────
  deploy-runner:
    name: Deploy to Runner (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.deploy_mode == 'runner'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy OTel stack
        run: |
          chmod +x scripts/deploy-otel.sh
          ./scripts/deploy-otel.sh

      - name: Verify all endpoints
        run: |
          echo "Verifying endpoints …"
          sleep 5

          check() {
            local label="$1" url="$2"
            if curl -sf "${url}" &>/dev/null; then
              echo "  [OK]   ${label}"
            else
              echo "  [WARN] ${label} — unreachable"
            fi
          }

          check "Collector"  "http://localhost:13133/"
          check "OTLP HTTP"  "http://localhost:4318/v1/traces"
          check "Jaeger UI"  "http://localhost:16686/"
          check "Prometheus" "http://localhost:9090/-/healthy"
          check "Grafana"    "http://localhost:3000/api/health"
          check "zPages"     "http://localhost:55679/"

      - name: Send test trace
        run: |
          curl -s -X POST http://localhost:4318/v1/traces \
            -H "Content-Type: application/json" \
            -d '{
              "resourceSpans": [{
                "resource": {
                  "attributes": [
                    {"key": "service.name", "value": {"stringValue": "forgecode-deploy-test"}},
                    {"key": "deploy.env", "value": {"stringValue": "${{ github.event.inputs.environment }}"}}
                  ]
                },
                "scopeSpans": [{
                  "scope": {"name": "deploy-test"},
                  "spans": [{
                    "traceId": "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6",
                    "spanId": "a1b2c3d4e5f6a7b8",
                    "name": "deploy-verification-span",
                    "kind": 1,
                    "startTimeUnixNano": "1700000000000000000",
                    "endTimeUnixNano": "1700000001000000000",
                    "status": {"code": 1}
                  }]
                }]
              }]
            }'
          echo "Test trace sent."

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f otel/docker-compose.yml logs --tail=200

      - name: Cleanup
        if: always()
        run: |
          chmod +x scripts/stop-otel.sh
          ./scripts/stop-otel.sh

  # ── Deploy via SSH to remote host ─────────────────────────────────
  deploy-remote:
    name: Deploy to Remote (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.deploy_mode == 'remote-ssh'
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Create remote directory
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/forgecode/otel"

      - name: Copy OTel configuration and scripts
        run: |
          scp -r otel/* \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/forgecode/otel/"
          scp scripts/deploy-otel.sh scripts/stop-otel.sh scripts/otel-status.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/forgecode/otel/"

      - name: Deploy on remote host
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" " \
            cd /opt/forgecode/otel && \
            chmod +x deploy-otel.sh stop-otel.sh otel-status.sh && \
            ./deploy-otel.sh \
          "

      - name: Verify remote deployment
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" " \
            curl -sf http://localhost:13133/ && echo 'Remote collector is healthy' \
          "
