# Performance Dashboard Workflow
# Executes benchmarks, collects metrics, performs trend analysis, deploys dashboard.

name: Performance Dashboard

on:
  push:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full_report:
        description: "Generate full trend report"
        required: false
        default: "true"
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  BENCHMARK_OUTPUT: benchmarks/results
  DASHBOARD_OUTPUT: benchmarks/dashboard

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-benchmark pytest-asyncio \
                      opentelemetry-api opentelemetry-sdk \
                      psutil pyyaml tabulate

      - name: Set up Rust (if applicable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run performance benchmarks
        run: |
          mkdir -p ${{ env.BENCHMARK_OUTPUT }}

          # Run Python benchmarks
          pytest tests/ -v --benchmark-only --benchmark-json=${{ env.BENCHMARK_OUTPUT }}/python-bench.json \
                 -k "test_" --ignore=tests/chaos --timeout=300 2>&1 \
                 | tee ${{ env.BENCHMARK_OUTPUT }}/benchmark.log || true

          # Run fault injection benchmarks (latency impact)
          pytest tests/chaos/test_fault_injection.py::TestLatencyInjection \
                 -v --benchmark-only --benchmark-json=${{ env.BENCHMARK_OUTPUT }}/latency-bench.json \
                 2>&1 | tee -a ${{ env.BENCHMARK_OUTPUT }}/benchmark.log || true

          echo "Benchmarks complete"

      - name: Collect system metrics snapshot
        run: |
          python -c "
          import json, platform, os, time

          metrics = {
              'timestamp': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'os': platform.system(),
              'cpu_count': os.cpu_count(),
              'python': platform.python_version(),
          }

          try:
              import psutil
              metrics['memory_total_gb'] = round(psutil.virtual_memory().total / (1024**3), 2)
              metrics['memory_available_gb'] = round(psutil.virtual_memory().available / (1024**3), 2)
              metrics['cpu_percent'] = psutil.cpu_percent(interval=1)
          except ImportError:
              metrics['note'] = 'psutil not available'

          with open('${{ env.BENCHMARK_OUTPUT }}/system-metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)

          print(json.dumps(metrics, indent=2))
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ env.BENCHMARK_OUTPUT }}/
          retention-days: 90

  trend-analysis:
    name: Trend Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: benchmark
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full_report == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install tabulate pyyaml

      - name: Download previous benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current

      - name: Download trend history
        uses: actions/download-artifact@v4
        with:
          name: perf-trend-history
          path: historical
        continue-on-error: true

      - name: Analyze trends
        run: |
          python -c "
          import json, os, glob

          # Load current results
          current_file = 'current/python-bench.json'
          if os.path.exists(current_file):
              with open(current_file) as f:
                  current = json.load(f)
              benchmarks = current.get('benchmarks', [])
              print(f'Current run: {len(benchmarks)} benchmarks')

              # Extract key metrics
              summary = []
              for b in benchmarks:
                  summary.append({
                      'name': b.get('name', 'unknown'),
                      'mean_ms': round(b.get('stats', {}).get('mean', 0) * 1000, 2),
                      'min_ms': round(b.get('stats', {}).get('min', 0) * 1000, 2),
                      'max_ms': round(b.get('stats', {}).get('max', 0) * 1000, 2),
                      'stddev_ms': round(b.get('stats', {}).get('stddev', 0) * 1000, 4),
                  })

              # Save analysis
              os.makedirs('trend', exist_ok=True)
              with open('trend/analysis.json', 'w') as f:
                  json.dump({'timestamp': '$(date -u +%Y-%m-%dT%H:%M:%SZ)', 'benchmarks': summary}, f, indent=2)

              # Print table
              from tabulate import tabulate
              table = [[s['name'], s['mean_ms'], s['min_ms'], s['max_ms'], s['stddev_ms']] for s in summary[:20]]
              print(tabulate(table, headers=['Benchmark', 'Mean (ms)', 'Min (ms)', 'Max (ms)', 'StdDev (ms)']))
          else:
              print('No benchmark results found, skipping trend analysis')
          "

      - name: Detect regressions
        run: |
          python -c "
          import json, os

          current_path = 'current/python-bench.json'
          if not os.path.exists(current_path):
              print('No current results, skipping regression check')
              exit(0)

          with open(current_path) as f:
              current = json.load(f)

          regressions = []
          for b in current.get('benchmarks', []):
              name = b.get('name', 'unknown')
              mean_ms = b.get('stats', {}).get('mean', 0) * 1000
              if mean_ms > 1000:
                  regressions.append({'name': name, 'mean_ms': round(mean_ms, 2)})

          if regressions:
              print(f'Performance regressions detected ({len(regressions)} benchmarks > 1s):')
              for r in regressions:
                  print(f'  {r[\"name\"]}: {r[\"mean_ms\"]}ms')
              exit(1)
          else:
              print('No regressions detected - all benchmarks within threshold')
          "

      - name: Upload trend data
        uses: actions/upload-artifact@v4
        with:
          name: perf-trend-analysis
          path: trend/
          retention-days: 90

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [benchmark, trend-analysis]
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install tabulate pyyaml

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current

      - name: Download trend analysis
        uses: actions/download-artifact@v4
        with:
          name: perf-trend-analysis
          path: trend
        continue-on-error: true

      - name: Generate dashboard HTML
        run: |
          python -c "
          import json, os
          from datetime import datetime

          timestamp = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')

          # Load benchmark data
          bench_data = '{}'
          bench_file = 'current/python-bench.json'
          if os.path.exists(bench_file):
              with open(bench_file) as f:
                  bench_data = f.read()

          # Load trend data
          trend_data = '{}'
          trend_file = 'trend/analysis.json'
          if os.path.exists(trend_file):
              with open(trend_file) as f:
                  trend_data = f.read()

          html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>ForgeCode Performance Dashboard</title>
              <style>
                  * {{ margin: 0; padding: 0; box-sizing: border-box; }}
                  body {{ font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }}
                  .header {{ text-align: center; margin-bottom: 2rem; }}
                  .header h1 {{ font-size: 1.8rem; color: #58a6ff; }}
                  .header p {{ color: #8b949e; margin-top: 0.5rem; }}
                  .grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; }}
                  .card {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; }}
                  .card h2 {{ font-size: 1rem; color: #58a6ff; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }}
                  .metric {{ display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid #21262d; }}
                  .metric:last-child {{ border-bottom: none; }}
                  .metric-label {{ color: #8b949e; }}
                  .metric-value {{ font-weight: 600; }}
                  .healthy {{ color: #3fb950; }}
                  .warning {{ color: #d29922; }}
                  .critical {{ color: #f85149; }}
                  .full-width {{ grid-column: 1 / -1; }}
                  pre {{ background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 1rem; overflow-x: auto; font-size: 0.85rem; }}
              </style>
          </head>
          <body>
              <div class=\"header\">
                  <h1>ForgeCode Performance Dashboard</h1>
                  <p>Last updated: {timestamp}</p>
              </div>
              <div class=\"grid\">
                  <div class=\"card\">
                      <h2>Benchmark Summary</h2>
                      <div id=\"summary\">Loading...</div>
                  </div>
                  <div class=\"card\">
                      <h2>Trend Analysis</h2>
                      <div id=\"trends\">Loading...</div>
                  </div>
                  <div class=\"card full-width\">
                      <h2>Raw Benchmark Data</h2>
                      <pre id=\"raw-data\"></pre>
                  </div>
              </div>
              <script>
                  const benchData = JSON.parse('{bench_data.replace(chr(39), chr(92)+chr(39))}');
                  const trendData = JSON.parse('{trend_data.replace(chr(39), chr(92)+chr(39))}');

                  const summary = document.getElementById('summary');
                  const trends = document.getElementById('trends');
                  const raw = document.getElementById('raw-data');

                  if (benchData.benchmarks) {{
                      const benchmarks = benchData.benchmarks;
                      summary.innerHTML = benchmarks.slice(0, 10).map(b => {{
                          const ms = (b.stats.mean * 1000).toFixed(2);
                          const cls = ms > 1000 ? 'critical' : ms > 500 ? 'warning' : 'healthy';
                          return '<div class=\"metric\"><span class=\"metric-label\">' + b.name + '</span><span class=\"metric-value ' + cls + '\">' + ms + 'ms</span></div>';
                      }}).join('');
                  }} else {{
                      summary.innerHTML = '<p>No benchmark data available</p>';
                  }}

                  if (trendData.benchmarks) {{
                      trends.innerHTML = trendData.benchmarks.slice(0, 10).map(b => {{
                          const cls = b.mean_ms > 1000 ? 'critical' : b.mean_ms > 500 ? 'warning' : 'healthy';
                          return '<div class=\"metric\"><span class=\"metric-label\">' + b.name + '</span><span class=\"metric-value ' + cls + '\">' + b.mean_ms + 'ms (avg)</span></div>';
                      }}).join('');
                  }} else {{
                      trends.innerHTML = '<p>No trend data available</p>';
                  }}

                  raw.textContent = JSON.stringify(benchData, null, 2).slice(0, 5000);
              </script>
          </body>
          </html>'''

          os.makedirs('_site', exist_ok=True)
          with open('_site/index.html', 'w') as f:
              f.write(html)
          print('Dashboard generated at _site/index.html')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
