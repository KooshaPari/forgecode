name: Release Drafter
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - closed
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  update_release_draft:
    name: update_release_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@5a60cd8ddda6dc14fce77159675b8fd2cdca4007
        with: 
          config-name: release-drafter.yml
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}