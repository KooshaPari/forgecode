[package]
name = "forge_paste"
version = "0.1.0"
edition = "2021"
description = "Input pipeline: bracketed paste, image protocols, @-mention parsing, paste classification and collapse"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
arboard = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bstr = { workspace = true }
crossterm = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
image = ["dep:crossterm", "dep:base64"]
clipboard = ["dep:arboard"]
