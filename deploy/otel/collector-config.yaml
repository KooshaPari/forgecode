# forgecode OTel Collector - Production Configuration
# This configuration is hardened for production workloads.
# See https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3000" # Grafana
            - "http://localhost:8080" # Dev server

processors:
  # Prevents out-of-memory by dropping data if the collector is overloaded.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${OTEL_MEMORY_LIMIT_MIB:1024}
    spike_limit_mib: ${OTEL_MEMORY_SPIKE_LIMIT_MIB:256}

  # Batches spans/metrics/logs before exporting to reduce network overhead.
  batch:
    send_batch_size: 8192
    timeout: 2s

  # Adds metadata about the host and container environment.
  resourcedetection:
    detectors: [env, system, docker, container]
    timeout: 5s
    override: false

  # Adds common resource attributes to all signals.
  resource:
    attributes:
      - key: deployment.environment
        value: "production"
        action: upsert

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s]
    dimensions:
      - name: service.name
      - name: http.method
      - name: http.status_code

exporters:
  # Trace Exporter (Jaeger)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics Exporter (Prometheus)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: forgecode_otel
    resource_to_telemetry_conversion:
      enabled: true

  # Debug Exporter (for troubleshooting)
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: info
      development: false
      disable_caller: false
      disable_stacktrace: false
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/jaeger]
    traces/spanmetrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [debug]
