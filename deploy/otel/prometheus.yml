global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["collector:8889"]
        labels:
          environment: "production"

  - job_name: "otel-collector-telemetry"
    static_configs:
      - targets: ["collector:8888"]
        labels:
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
        labels:
          environment: "production"
